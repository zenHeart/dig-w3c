<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>input[type=number] 负值与非法数值验证 - 交互演示</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --card: #ffffff;
      --primary: #4361ee;
      --success: #2ec4b6;
      --danger: #e63946;
      --warning: #f4a261;
      --text: #2b2d42;
      --text-light: #6c757d;
      --border: #dee2e6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 48px;
    }

    header h1 {
      font-size: 28px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-light);
      font-size: 16px;
    }

    .badge {
      display: inline-block;
      background: var(--primary);
      color: #fff;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 16px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 24px;
    }

    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .card-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .card-title {
      font-size: 16px;
      font-weight: 600;
    }

    .card-subtitle {
      font-size: 12px;
      color: var(--text-light);
    }

    .card-icon.strategy { background: #e8edff; }
    .card-icon.negative { background: #ffe8e8; }
    .card-icon.sanitize { background: #e8fff4; }
    .card-icon.complete { background: #fff3e8; }

    .input-group {
      margin-bottom: 16px;
    }

    .input-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-light);
      margin-bottom: 6px;
    }

    input[type="number"] {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid var(--border);
      border-radius: 10px;
      font-size: 16px;
      transition: border-color 0.2s, box-shadow 0.2s;
      -moz-appearance: textfield;
    }

    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    input[type="number"]:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.15);
    }

    input[type="number"].valid {
      border-color: var(--success);
      background: #f0fffc;
    }

    input[type="number"].invalid {
      border-color: var(--danger);
      background: #fff8f8;
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-top: 12px;
    }

    .status-bar.empty {
      background: #f8f9fa;
      color: var(--text-light);
    }

    .status-bar.success {
      background: #e8fff4;
      color: #1a936f;
    }

    .status-bar.error {
      background: #ffe8e8;
      color: #c1121f;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }

    .code-tag {
      display: inline-block;
      background: #f1f3f5;
      color: #868e96;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-family: 'Fira Code', monospace;
      margin-top: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: #3451d1;
    }

    .btn-outline {
      background: transparent;
      border: 2px solid var(--border);
      color: var(--text);
    }

    .btn-outline:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    .log-panel {
      background: #1e1e2e;
      border-radius: 12px;
      padding: 16px;
      margin-top: 16px;
      max-height: 200px;
      overflow-y: auto;
    }

    .log-entry {
      font-family: 'Fira Code', 'Consolas', monospace;
      font-size: 12px;
      color: #cdd6f4;
      padding: 4px 0;
      border-bottom: 1px solid #313244;
    }

    .log-entry:last-child {
      border-bottom: none;
    }

    .log-entry .tag {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 10px;
      margin-right: 8px;
    }

    .log-entry .tag.input { background: #89b4fa; color: #1e1e2e; }
    .log-entry .tag.blur { background: #a6e3a1; color: #1e1e2e; }
    .log-entry .tag.keydown { background: #f9e2af; color: #1e1e2e; }

    .scenario-section {
      margin-top: 40px;
    }

    .scenario-section h2 {
      font-size: 20px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .scenario-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }

    .scenario-card {
      background: var(--card);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.04);
    }

    .scenario-card h3 {
      font-size: 14px;
      margin-bottom: 8px;
    }

    .scenario-card .desc {
      font-size: 12px;
      color: var(--text-light);
      margin-bottom: 12px;
    }

    .scenario-result {
      padding: 10px 12px;
      background: #f8f9fa;
      border-radius: 8px;
      font-size: 13px;
    }

    .footer {
      text-align: center;
      margin-top: 60px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      color: var(--text-light);
      font-size: 13px;
    }

    @media (max-width: 640px) {
      .container { padding: 24px 16px; }
      header h1 { font-size: 22px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="badge">BOM · Browser Object Model</div>
      <h1>input[type=number] 验证策略演示</h1>
      <p>测试不同策略对负值、科学计数法、非法字符的处理效果</p>
    </header>

    <div class="grid">
      <!-- 策略一：min 属性 -->
      <div class="card">
        <div class="card-header">
          <div class="card-icon strategy">①</div>
          <div>
            <div class="card-title">策略一：min 属性</div>
            <div class="card-subtitle">最基础的 HTML 验证</div>
          </div>
        </div>
        
        <div class="input-group">
          <label>仅整数（min=0）</label>
          <input type="number" id="min-only" min="0" step="1" placeholder="输入任意值测试">
        </div>

        <div class="status-bar empty" id="status-min-only">
          <div class="status-dot"></div>
          <span>等待输入...</span>
        </div>

        <div class="code-tag">&lt;input min="0" step="1"&gt;</div>

        <div class="actions">
          <button class="btn btn-outline" onclick="testPaste('min-only', '-5')">粘贴 -5</button>
          <button class="btn btn-outline" onclick="testPaste('min-only', '1e5')">粘贴 1e5</button>
        </div>
      </div>

      <!-- 策略二：onkeydown 拦截 -->
      <div class="card">
        <div class="card-header">
          <div class="card-icon negative">②</div>
          <div>
            <div class="card-title">策略二：onkeydown 拦截</div>
            <div class="card-subtitle">阻止负号键输入</div>
          </div>
        </div>
        
        <div class="input-group">
          <label>拦截负号键</label>
          <input type="number" id="keydown-block" min="0" placeholder="按 - 键测试">
        </div>

        <div class="status-bar empty" id="status-keydown-block">
          <div class="status-dot"></div>
          <span>等待输入...</span>
        </div>

        <div class="actions">
          <button class="btn btn-outline" onclick="testPaste('keydown-block', '-5')">粘贴 -5</button>
          <button class="btn btn-outline" onclick="testPaste('keydown-block', 'abc')">粘贴 abc</button>
        </div>
      </div>

      <!-- 策略三：oninput 实时过滤 -->
      <div class="card">
        <div class="card-header">
          <div class="card-icon sanitize">③</div>
          <div>
            <div class="card-title">策略三：oninput 实时过滤</div>
            <div class="card-subtitle">过滤负号和科学计数法</div>
          </div>
        </div>
        
        <div class="input-group">
          <label>实时过滤</label>
          <input type="number" id="oninput-filter" min="0" placeholder="粘贴任意值测试">
        </div>

        <div class="status-bar empty" id="status-oninput-filter">
          <div class="status-dot"></div>
          <span>等待输入...</span>
        </div>

        <div class="actions">
          <button class="btn btn-outline" onclick="testPaste('oninput-filter', '-5')">粘贴 -5</button>
          <button class="btn btn-outline" onclick="testPaste('oninput-filter', '1e-3')">粘贴 1e-3</button>
          <button class="btn btn-outline" onclick="testPaste('oninput-filter', '0.1.2')">粘贴 0.1.2</button>
        </div>
      </div>

      <!-- 策略四：完整净化方案 -->
      <div class="card">
        <div class="card-header">
          <div class="card-icon complete">④</div>
          <div>
            <div class="card-title">策略四：完整净化方案</div>
            <div class="card-subtitle">min + oninput + onblur 组合</div>
          </div>
        </div>
        
        <div class="input-group">
          <label>完整验证（min=0, max=100, step=0.01）</label>
          <input type="number" id="complete-solution" min="0" max="100" step="0.01" placeholder="输入测试">
        </div>

        <div class="status-bar empty" id="status-complete-solution">
          <div class="status-dot"></div>
          <span>等待输入...</span>
        </div>

        <div class="log-panel" id="log-complete"></div>

        <div class="actions">
          <button class="btn btn-outline" onclick="testPaste('complete-solution', '-5')">粘贴 -5</button>
          <button class="btn btn-outline" onclick="testPaste('complete-solution', '150')">粘贴 150（超限）</button>
          <button class="btn btn-outline" onclick="testPaste('complete-solution', '1e5')">粘贴 1e5</button>
        </div>
      </div>
    </div>

    <!-- 场景测试 -->
    <div class="scenario-section">
      <h2>🧪 场景测试</h2>
      <div class="scenario-grid" id="scenario-grid"></div>
    </div>

    <div class="footer">
      <p>演示页面 · <a href="../docs/bom/input-number-validation.md">查看文档</a></p>
    </div>
  </div>

  <script>
    // ============ 初始化策略 ============

    // 策略一：仅 min 属性（无 JS）
    // 直接使用 HTML min 属性

    // 策略二：onkeydown 拦截负号
    (function() {
      const input = document.getElementById('keydown-block');
      const status = document.getElementById('status-keydown-block');
      
      input.addEventListener('keydown', (e) => {
        if (e.key === '-') {
          e.preventDefault();
          showStatus(status, 'warn', '已阻止负号键');
        }
      });
      
      input.addEventListener('input', () => updateStatus(status, input));
      input.addEventListener('blur', () => updateStatus(status, input));
    })();

    // 策略三：oninput 实时过滤
    (function() {
      const input = document.getElementById('oninput-filter');
      const status = document.getElementById('status-oninput-filter');
      
      input.addEventListener('input', (e) => {
        let value = e.target.value;
        
        // 移除科学计数法
        if (/[eE]/.test(value)) {
          value = value.replace(/[eE]/g, '');
          e.target.value = value;
          showStatus(status, 'warn', '已移除科学计数法符号');
          return;
        }
        
        // 移除负号
        if (value < 0) {
          value = value.replace(/-/g, '');
          e.target.value = value;
          showStatus(status, 'warn', '已移除负号');
          return;
        }
        
        updateStatus(status, input);
      });
      
      input.addEventListener('blur', () => updateStatus(status, input));
    })();

    // 策略四：完整净化方案
    (function() {
      const input = document.getElementById('complete-solution');
      const status = document.getElementById('status-complete-solution');
      const logPanel = document.getElementById('log-complete');
      
      let logCount = 0;
      
      function addLog(type, message) {
        const entry = document.createElement('div');
        entry.className = 'log-entry';
        entry.innerHTML = `<span class="tag ${type}">${type.toUpperCase()}</span>${message}`;
        logPanel.appendChild(entry);
        logPanel.scrollTop = logPanel.scrollHeight;
        
        // 限制日志数量
        if (logCount++ > 50) {
          logPanel.removeChild(logPanel.firstChild);
        }
      }
      
      input.addEventListener('keydown', (e) => {
        if (e.key === '-') {
          e.preventDefault();
          addLog('keydown', '阻止负号键');
          return;
        }
        if (!/[\d.]/.test(e.key) && !['Backspace','Delete','ArrowLeft','ArrowRight','Tab'].includes(e.key)) {
          e.preventDefault();
          addLog('keydown', `阻止键: ${e.key}`);
        }
      });
      
      input.addEventListener('input', (e) => {
        let value = e.target.value;
        let warnings = [];
        
        // 移除科学计数法
        if (/[eE]/.test(value)) {
          value = value.replace(/[eE]/g, '');
          warnings.push('移除 e/E');
        }
        
        // 移除负号
        if (value < 0 || value.startsWith('-')) {
          value = value.replace(/-/g, '');
          warnings.push('移除负号');
        }
        
        e.target.value = value;
        
        if (warnings.length) {
          addLog('input', warnings.join(', '));
        } else {
          addLog('input', `当前值: "${value}"`);
        }
        
        updateStatus(status, input);
      });
      
      input.addEventListener('blur', (e) => {
        let value = parseFloat(e.target.value);
        const min = parseFloat(input.min) || 0;
        const max = parseFloat(input.max) || Infinity;
        
        if (isNaN(value) || value < min || value > max) {
          addLog('blur', `值 ${isNaN(value) ? e.target.value : value} 超出范围 [${min}, ${max}]，已清空`);
          e.target.value = '';
        } else if (value !== parseFloat(e.target.value)) {
          addLog('blur', `精度校正: ${e.target.value} → ${value}`);
          e.target.value = value;
        } else {
          addLog('blur', `最终值: ${value}`);
        }
        
        updateStatus(status, input);
      });
    })();

    // ============ 通用函数 ============

    function updateStatus(statusEl, input) {
      const value = input.value;
      if (!value) {
        showStatus(statusEl, 'empty', '空值');
      } else {
        const num = parseFloat(value);
        if (isNaN(num)) {
          showStatus(statusEl, 'error', `非法: "${value}"`);
        } else if (num < 0) {
          showStatus(statusEl, 'error', `负数: ${num}`);
        } else {
          showStatus(statusEl, 'success', `有效: ${num}`);
        }
      }
    }

    function showStatus(el, type, message) {
      el.className = `status-bar ${type}`;
      el.innerHTML = `<div class="status-dot"></div><span>${message}</span>`;
    }

    function testPaste(inputId, text) {
      const input = document.getElementById(inputId);
      
      // 模拟粘贴
      const nativeInputValueSetter = Object.getOwnPropertyDescriptor(
        window.HTMLInputElement.prototype, 'value'
      ).set;
      
      nativeInputValueSetter.call(input, text);
      
      const inputEvent = new Event('input', { bubbles: true });
      input.dispatchEvent(inputEvent);
      
      showStatus(document.getElementById('status-' + inputId), 'warn', `粘贴: "${text}"`);
    }

    // ============ 场景测试 ============

    const scenarios = [
      { name: '粘贴 "abc"', input: 'abc', expected: '空/NaN' },
      { name: '粘贴 "-123"', input: '-123', expected: '移除负号 → 123' },
      { name: '粘贴 "1.5e2"', input: '1.5e2', expected: '150 (移除e)' },
      { name: '粘贴 "0.1.2"', input: '0.1.2', expected: '0.12 (parseFloat)' },
      { name: '粘贴 "1e-3"', input: '1e-3', expected: '移除e → 13' },
      { name: '粘贴 "-0"', input: '-0', expected: '0' },
      { name: '粘贴 "999999"', input: '999999', expected: '超max则清空' },
      { name: '粘贴 ""', input: '', expected: '空值' },
    ];

    function runScenario(index) {
      const s = scenarios[index];
      const input = document.getElementById('complete-solution');
      
      // 清空并重置
      input.value = '';
      
      // 模拟粘贴
      const nativeInputValueSetter = Object.getOwnPropertyDescriptor(
        window.HTMLInputElement.prototype, 'value'
      ).set;
      
      nativeInputValueSetter.call(input, s.input);
      const inputEvent = new Event('input', { bubbles: true });
      input.dispatchEvent(inputEvent);
      
      // 触发 blur
      const blurEvent = new Event('blur', { bubbles: true });
      input.dispatchEvent(blurEvent);
      
      // 获取结果
      const result = input.value;
      const resultEl = document.getElementById('scenario-result-' + index);
      resultEl.textContent = result === '' ? '(空)' : result;
      resultEl.style.color = result === '' || result === 'NaN' ? 'var(--danger)' : 'var(--success)';
    }

    // 渲染场景
    const grid = document.getElementById('scenario-grid');
    scenarios.forEach((s, i) => {
      const card = document.createElement('div');
      card.className = 'scenario-card';
      card.innerHTML = `
        <h3>场景 ${i + 1}: ${s.name}</h3>
        <div class="desc">预期: ${s.expected}</div>
        <div class="scenario-result" id="scenario-result-${i}">—</div>
        <button class="btn btn-primary" style="margin-top:12px;width:100%" onclick="runScenario(${i})">
          运行测试
        </button>
      `;
      grid.appendChild(card);
    });
  </script>
</body>
</html>
